name: Unit Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests --config Release
      - name: Run
        run: ctest --test-dir build-tests -C Release --output-on-failure

  sanitizers:
    name: Core tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-tests
      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

  ui-preview:
    name: Dock screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev libqt6svg6-dev fonts-noto-cjk ninja-build
      - name: Build
        run: cmake -S tests/ui-preview -B build-preview -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-preview
      - name: Render
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          KB_THEME=dark KB_OUT=shots/dark build-preview/kaibo-ui-preview
          KB_THEME=light KB_OUT=shots/light build-preview/kaibo-ui-preview
      - uses: actions/upload-artifact@v7
        with:
          name: dock-screenshots
          path: shots

  locales:
    name: Locale files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check zh-CN / zh-TW / en-US are complete and consistent
        run: python3 tools/check-locales.py

  theme:
    name: Design tokens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check hard-coded colours and QSS token placeholders
        run: python3 tools/check-theme.py
